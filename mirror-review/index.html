<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Mirror - App Review Demonstration</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      padding: 32px 16px;
      background: #f5f5f7;
      color: #1d1d1f;
    }
    main {
      width: min(100%, 680px);
      margin: 0 auto;
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.5rem, 5vw, 2rem);
    }
    p {
      margin: 0 0 20px;
      line-height: 1.5;
    }
    video {
      display: block;
      width: min(100%, 430px);
      height: auto;
      max-height: 78vh;
      margin: 0 auto 20px;
      background: #000;
      border-radius: 12px;
      box-shadow: 0 8px 28px rgb(0 0 0 / 18%);
    }
    a { color: #06c; }
    @media (prefers-color-scheme: dark) {
      body { background: #111; color: #f5f5f7; }
      a { color: #2997ff; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Mirror - App Review Demonstration</h1>
    <p>This video demonstrates the Mirror app running on an iPhone.</p>
    <video controls playsinline preload="metadata">
      <source src="mirror-review.mp4" type="video/mp4">
      Your browser does not support HTML5 video.
    </video>
    <p><a href="mirror-review.mp4">Open or download the video directly</a></p>
  </main>
</body>
</html>
